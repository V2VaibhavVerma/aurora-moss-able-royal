<!doctype html>
<html>
<head>
<style>

img.s16{width:16px;height:16px;image-rendering:auto;background:#0b1014}
img.s32{width:32px;height:32px}
img.s64{width:64px;height:64px}
</style>
</head>
<body>
<div class="row">
  <div class="cell">
    <img class="s16" src="fav-cut.svg">
    <img class="s32" src="fav-cut.svg">
    <img class="s64" src="fav-cut.svg">cut
  </div>
  <div class="cell">
    <img class="s16" src="fav-split.svg">
    <img class="s32" src="fav-split.svg">
    <img class="s64" src="fav-split.svg">split
  </div>
  <div class="cell">
    <img class="s16" src="fav-mark.svg">
    <img class="s32" src="fav-mark.svg">
    <img class="s64" src="fav-mark.svg">mark
  </div>
</div>
</body>
</html>
